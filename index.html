<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive iFrame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        /* Fullscreen Responsive iFrame Container */
        .iframe-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            padding-bottom: 0;
            overflow: hidden;
            background-color: #000;
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="iframe-wrapper">
        <iframe src="https://airanode.instatus.com/"></iframe>
    </div>
</body>
</html>
